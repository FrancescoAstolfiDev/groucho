name: Build & Test (JDK 8)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    name: mvn clean install (JDK 8)
    # Pinned instead of ubuntu-latest: lsh-invivo needs Python 3.12 + libpython3.12 (same as the local WSL setup)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Same heap settings as .travis.yml (-XX:MaxPermSize dropped: ignored by Java 8)
    env:
      MAVEN_OPTS: -Xms1024m -Xmx2g
      MAVEN_SKIP_RC: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GROUCHO and CROCHET require Java 8: CROCHET instruments the JRE of $JAVA_HOME (jre/lib/rt.jar)
      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # lsh-invivo builds JEP from source with "pip install -t ..." (needs Python headers, gcc and $JAVA_HOME)
      # and loads libpython3.12.so at test time
      - name: Install Python and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-dev python3-pip build-essential
          python3 --version
          pip --version

      - name: Show toolchain
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          mvn -v

      # Full build, unit tests (surefire) and integration tests (failsafe) of every module
      - name: Build and test
        run: mvn -B -ntp clean install

      # Same as the Travis "after_success" step: JaCoCo coverage aggregated in groucho-sonar
      # (carving state tests are excluded there as well). SonarCloud upload is skipped: it needs the IASI-SAKS token
      - name: Coverage (qaProfile, as in .travis.yml)
        run: mvn -B -ntp -PqaProfile -Dgroucho-core.test.excludes="**/carvingStateTests/*" verify

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: groucho-sonar/target/site/jacoco-aggregate/
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
