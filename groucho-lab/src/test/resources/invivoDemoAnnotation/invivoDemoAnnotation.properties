# Configuration of the annotation-driven in-vivo demo (see groucho-lab/invivo-demo.sh)

# LSH-based governance manager: it activates the test only for new states, asking groucho-lsh-rest
# (the server must be running; the URL can be changed with -Dgroucho.lsh.rest_client.urlBasePath=...).
# Commenting out the line falls back to SimpleGovernanceManager, which always activates the test.
# With GovernanceManagerBasic the server receives the carved state, with GovernanceManagerByHistory_HASH a hash of it.
groucho.governance.manager.class=it.cnr.iasi.saks.groucho.gm_history.GovernanceManagerByHistory_HASH

# Packages the agents must not transform.
# The LSH client (Spring, threetenbp, JDK XML) must be excluded: it is created while the
# Governance Manager is being built, and its instrumented constructors would ask for the
# Governance Manager again (StackOverflowError).
groucho.transformer.disable.classesList=org/objectweb/asm,com/fasterxml/jackson,org/apache/log4j,javax,org/mockito,com/sun,org/apache/commons/logging,org/springframework,org/threeten,it/cnr/iasi/saks/groucho/lsh,org/xml,org/w3c,jdk/xml
