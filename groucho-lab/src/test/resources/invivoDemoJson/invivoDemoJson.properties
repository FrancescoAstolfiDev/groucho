# Configurazione della demo in-vivo guidata da JSON (vedi groucho-lab/invivo-demo-json.sh)

# File JSON con i metodi da annotare: e' letto dal CLASSPATH, non dal filesystem
groucho.lab.intrument.jsonFile=invivoDemoJson/model.json

# Governance manager basato su LSH: attiva il test solo per stati nuovi, chiedendo a groucho-lsh-rest
# (il server deve essere in esecuzione; URL modificabile con -Dgroucho.lsh.rest.url=...).
# Commentando la riga si torna a SimpleGovernanceManager, che attiva sempre il test.
# Con GovernanceManagerBasic al server arriva lo stato carvato, con GovernanceManagerByHistory_LSH un suo hash.
groucho.governance.manager.class=it.cnr.iasi.saks.groucho.gm_history.GovernanceManagerByHistory_HASH

# Pacchetti che gli agent non devono trasformare.
# Il client LSH (Spring, threetenbp, XML del JDK) va escluso: viene creato mentre si costruisce il
# Governance Manager, e i suoi costruttori strumentati richiederebbero di nuovo il Governance Manager
# (StackOverflowError).
groucho.transformer.disable.classesList=org/objectweb/asm,com/fasterxml/jackson,org/apache/log4j,javax,org/mockito,com/sun,org/apache/commons/logging,org/springframework,org/threeten,it/cnr/iasi/saks/groucho/lsh,org/xml,org/w3c,jdk/xml
