# Configurazione della demo in-vivo guidata da JSON (vedi groucho-lab/invivo-demo-json.sh)

# File JSON con i metodi da annotare: e' letto dal CLASSPATH, non dal filesystem
groucho.lab.intrument.jsonFile=invivoDemoJson/model.json

# Nessun governance manager indicato: si usa SimpleGovernanceManager, che attiva sempre il test
#groucho.governance.manager.class=

# Pacchetti che gli agent non devono trasformare
groucho.transformer.disable.classesList=org/objectweb/asm,com/fasterxml/jackson,org/apache/log4j,javax,org/mockito,com/sun,org/apache/commons/logging
