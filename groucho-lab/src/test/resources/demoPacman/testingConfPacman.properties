# Configuration of the demoPacman tests (profile pacmanProfile of groucho-lab)

# JSON with the methods to annotate: it is read from the CLASSPATH (target/test-classes), not from the filesystem
groucho.lab.intrument.jsonFile=demoPacman/model.json

# Same governance manager as the os-cache experiments: the in-vivo test is activated with a configurable probability
groucho.governance.manager.class=it.cnr.iasi.saks.groucho.performanceOverheadTest.TestGovernanceManager_ActivationWithProbability

# Packages that the agents must not transform: the same as testingConfExperiments.properties, plus Guava (com/google)
groucho.transformer.disable.classesList=org/objectweb/asm,com/fasterxml/jackson,org/apache/log4j,javax,org/mockito,com/sun,org/apache/commons/logging,org/jacoco,com/google
